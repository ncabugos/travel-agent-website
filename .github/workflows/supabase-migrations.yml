name: Supabase migrations

# Applies any new SQL files in supabase/migrations/ to the production
# Supabase project whenever they land on main. Keeps the DB in lockstep
# with deploys so migrations can't silently drift again.
#
# This workflow is OPT-IN. Until the repo secrets below are set it SKIPS the
# push and finishes green (with a notice) instead of failing — migrations are
# applied manually via the service-role scripts + committed migration files in
# the meantime. It starts auto-applying the moment all three secrets exist.
#
# One-time setup — add these repo secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD    the project's database password
#   SUPABASE_PROJECT_REF    the project ref (subdomain in your SUPABASE_URL)
#
# IMPORTANT: even with secrets set, this only works AFTER the existing
# migrations have been baselined with `supabase migration repair`
# (see supabase/MIGRATIONS.md), otherwise `db push` will try to re-run 001+
# against a populated DB and fail.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Supabase migrations skipped::Repo secrets SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_REF are not all set. Skipping db push — migrations are applied manually (see supabase/MIGRATIONS.md to enable CI)."
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.configured == 'true'
        with:
          version: latest

      - name: Push pending migrations
        if: steps.cfg.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
